name: Ежедневный анализ конкурентов
on:
  schedule:
    - cron: '13 8 * * *'
  workflow_dispatch:
permissions:
  id-token: write
concurrency:
  group: competitors-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Обновить конкурентную сводку
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('dreamwood-competitors-refresh');
            const response = await fetch('https://dreamwood.pages.dev/api/competitors-refresh', {
              method: 'POST', headers: { authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(240000)
            });
            if (!response.ok) throw new Error(`Обновление не выполнено: ${response.status}`);
            const result = await response.json();
            core.info(`Локаций: ${result.competitors}; публикаций: ${result.news}; важных событий: ${result.important}`);
            core.info(`Недоступные источники: ${result.failed?.length ? result.failed.join(' | ') : 'нет'}`);
