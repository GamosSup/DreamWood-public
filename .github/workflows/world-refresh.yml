name: Обновление мировой сводки
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Обновить открытые источники
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('dreamwood-world-refresh');
            const response = await fetch('https://dreamwood.pages.dev/api/world-refresh', {
              method: 'POST', headers: { authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(240000)
            });
            if (!response.ok) throw new Error(`Обновление не удалось: ${response.status}`);
            const result = await response.json();
            core.info(`Обновлено: ${result.count} публикаций; недоступно источников: ${result.failed.length}`);
