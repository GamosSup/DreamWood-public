name: Публикация Dreamwood
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Проверить синтаксис
        run: |
          for file in ./*.js; do node --check "$file"; done
      - name: Подготовить открытые файлы
        run: node tools/build-public.cjs
      - name: Опубликовать Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy safe-public --project-name=dreamwood --branch=main
